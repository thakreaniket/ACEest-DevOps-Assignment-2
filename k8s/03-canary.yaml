# Stable Track (4 replicas = 80% traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        track: stable
    spec:
      containers:
      - name: aceest-app
        image: yourdockerhubusername/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "v1.0-STABLE"
---
# Canary Track (1 replica = 20% traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-new
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        track: canary
    spec:
      containers:
      - name: aceest-app
        image: yourdockerhubusername/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "v2.0-CANARY"
---
# Shared Service balances across both stable and canary pods
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-svc
spec:
  type: NodePort
  selector:
    app: aceest-canary
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30083