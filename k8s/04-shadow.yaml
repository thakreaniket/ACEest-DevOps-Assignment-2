# Primary Production Deployment (receives live user traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-primary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-shadow
      role: primary
  template:
    metadata:
      labels:
        app: aceest-shadow
        role: primary
    spec:
      containers:
      - name: aceest-app
        image: YOUR_REAL_DOCKERHUB_ID/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "v1.0-PRIMARY"
---
# Shadow Deployment (runs v2 silently alongside production for mirrored traffic/testing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-mirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
        role: shadow
    spec:
      containers:
      - name: aceest-app
        image: YOUR_REAL_DOCKERHUB_ID/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "v2.0-SHADOW"
---
# Service routes external users ONLY to primary
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-svc
spec:
  type: NodePort
  selector:
    app: aceest-shadow
    role: primary
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30084