# BLUE Environment (Stable v1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      env: blue
  template:
    metadata:
      labels:
        app: aceest-bg
        env: blue
    spec:
      containers:
      - name: aceest-app
        image: anikethakre/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "v1.0-BLUE"
---
# GREEN Environment (New Release v2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      env: green
  template:
    metadata:
      labels:
        app: aceest-bg
        env: green
    spec:
      containers:
      - name: aceest-app
        image: anikethakre/aceest-fitness:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "v2.0-GREEN"
---
# Live Service (Switch selector 'env: blue' -> 'env: green' for instant cutover/rollback)
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen-svc
spec:
  type: NodePort
  selector:
    app: aceest-bg
    env: blue
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30082